  <!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Окуу баракчасы — Учебная страница</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f5f5f7;
      color: #1d1d1f;
      line-height: 1.55;
    }

    .page-wrap {
      max-width: 960px;
      margin: 44px auto;
      padding: 0 20px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e5ea;
      border-radius: 18px;
      padding: 26px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      color: #0071e3;
      background: #eef6ff;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    h1, h2 {
      font-size: 26px;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 15px;
      color: #424245;
      margin-bottom: 10px;
    }

    .note {
      font-size: 13px;
      color: #6e6e73;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <main class="page-wrap">
    

    <section class="card">
      <span class="badge">Русский • Учебный проект</span>
      <h2>Практическая страница HTML и CSS</h2>
      <p>
        Эта страница создана для практики вёрстки и веб-дизайна в демонстрационном формате.
      </p>
      <p class="note">
        Примечание: Учебная страница для практики, не является официальным магазином или формой входа/оплаты.
      </p>
    </section>
  </main>
</body>
</html>
