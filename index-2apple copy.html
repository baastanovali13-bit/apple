<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <div class="card">
 
        <img src="https://object.pscloud.io/cms/cms/Photo/img_0_77_6135_0_1_l4iXYI.webp" alt="iPhone 16 Pro" class="card-img" />
        <div class="card-body">
          <h3>iPhone 16 Pro</h3>
          <p class="card-desc">Титан корпус, 4K 120fps видео тартуу мүмкүнчүлүгү жана жаңы Camera Control баскычы.</p>
          <div class="card-price">Баасы: $999</div>
          
        </div>
      </div>
        
      <style>
        .card {
  background: #f5f5f7;
  border-radius: 18px;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.card-img {
  width: 100%;
  height: 500px;
  object-fit: cover;
  display: block;
}

.card-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  flex: 1;
  
}

.card-desc {
  font-size: 14px;
  color: #515154;
  line-height: 1.5;
  margin-bottom: 18px;
}

 
.card-price {
  margin-top: auto;
  font-size: 18px;
  font-weight: 700;
  color: #1d1d1f;
  margin-bottom: 14px;
}
      </style>
</body>
</html>
